# RELEASES.yaml — m3mm.net's own release ledger.
# Collected by `python scripts/releases.py`; feeds this site's own /roadmap.

project: CompanySite
category: Company

entries:
  - date: 2026-08-18
    kind: shipped
    title: M3MM Hub — first official public release
    notes: >-
      The main m3mm.net company dashboard is the only officially released item
      in the public launch sequence. Reachable preview deployments do not count
      as releases.
    url: https://m3mm.net
    public: true

  - date: 2026-08-19
    kind: coming
    title: Resume moves onto the hub
    notes: >-
      Career section lands at m3mm.net, folding in what was a standalone
      ResumeSite Worker. One site instead of two, and no separate domain to buy.
    public: false

  - date: 2026-08-19
    kind: coming
    title: Website services spins out
    notes: >-
      The website-services department gets its own site rather than living as a
      page on the company hub, so the hub reads as the company and the service
      reads as the product.
    public: false

  - date: 2026-08-19
    kind: blocked
    title: Checkout waiting on a live Stripe link
    notes: >-
      Verified against the live Cloudflare API — PUBLIC_STRIPE_PAYMENT_LINK is
      unset on the m3-companysite Pages project, so /start gates to the free
      review instead of taking payment. It is a build-time variable, so the site
      must be rebuilt after it is set.
    public: false

  - date: 2026-07-19
    kind: shipped
    title: Lead OS deployed and verified internally
    notes: >-
      Every intake is scored, logged, alerted on, and auto-replied to. m3mm.net
      is the front door for the whole operation. This infrastructure milestone
      is not a separate public product release.
    url: https://m3mm.net
    public: false

  - date: 2026-06-25
    kind: coming
    title: Aries Outdoor Living — next official public launch
    notes: >-
      M3MM's first client build is already deployed and was sold at handoff,
      but its M3MM hard launch follows the Hub. Delivery proof and release
      sequence are tracked separately.
    url: https://ariesoutdoorliving.com
    public: false
